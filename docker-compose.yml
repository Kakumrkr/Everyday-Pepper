# Local development and CI smoke stack. `docker compose up --build` serves:
#   web http://localhost:3000 · api http://localhost:4000 · worker http://localhost:4100 (health; runs the outbox)
#   Mailpit (fake inbox) http://localhost:8025, SMTP localhost:1025
# Infra only, for `pnpm dev`: docker compose up postgres redis mailpit seaweedfs
# Credentials below are local-only defaults; override them in a git-ignored .env (see .env.example).
# Ports bind to 127.0.0.1 so nothing is exposed beyond this machine.
name: pepper

# api and worker connect as their own login role, which row-level security applies to; the
# POSTGRES_USER superuser only runs migrations (ADR-0010). `migrate` creates the login role.
x-database-url: &database-url postgres://${APP_DB_USER:-pepper_service}:${APP_DB_PASSWORD:-pepper_service_dev}@postgres:5432/${POSTGRES_DB:-pepper}

x-app-env: &app-env
  DATABASE_URL: *database-url
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
  # Optional; empty means off (see .env.example).
  RELEASE: ${RELEASE:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  # Local-only default; set your own in .env. Seals queued emails (ADR-0024); api and worker
  # must share it.
  OUTBOX_SECRET: ${OUTBOX_SECRET:-local-dev-only-outbox-secret-not-for-real-use}

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pepper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pepper_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pepper}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # BullMQ needs keys to stay put: never evict under memory pressure.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (ADR-0011, ADR-0048): business photos. Signed requests only, with
  # the local-only keys below (override them in .env); the api makes the bucket on start.
  seaweedfs:
    image: chrislusf/seaweedfs:4.01@sha256:d91cdf769018b143f1c944085b36d29893d9af199e656b2537367c35744fc221
    # Small volumes, grown one at a time, and an explicit maximum: left to size itself from
    # the free disk, a runner with less disk gets too few volumes and a new bucket's first
    # write fails with InternalError (S47.2's first CI run).
    command:
      [
        'server',
        '-s3',
        '-dir=/data',
        '-ip.bind=0.0.0.0',
        '-master.volumeSizeLimitMB=64',
        '-volume.max=100',
      ]
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: '1'
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pepperdev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pepper-dev-only-s3-secret}
    ports: ['127.0.0.1:8333:8333']
    volumes: [seaweedfs-data:/data]
    # Ready once it can store: S3 answers and the master hands out a write (`/dir/assign`).
    # S3's /healthz alone answers before the volume server may grow volumes (~10 s later, more
    # on a slow runner), when a first write fails with InternalError.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O - http://127.0.0.1:9333/dir/assign | grep -q fid',
        ]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  # One-shot: applies migrations and provisions the services' login role, then exits.
  migrate:
    build: { context: ., target: api }
    image: pepper-api:dev
    command: ['node', 'node_modules/@pepper/db/dist/migrate-cli.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-pepper}:${POSTGRES_PASSWORD:-pepper_dev}@postgres:5432/${POSTGRES_DB:-pepper}
      DATABASE_URL: *database-url
    healthcheck: { disable: true }
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    image: pepper-api:dev
    environment:
      <<: *app-env
      PORT: '4000'
      # Local-only default; set your own in .env. Signs session cookies and encrypts TOTP secrets.
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-auth-secret-not-for-real-use}
      # The browser talks to web, which forwards /api/auth and /v1 to the api (ADR-0012).
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      # The booking page's codes (ADR-0022) go straight to Mailpit's inbox (port 8025).
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Pepper <bookings@pepper.localhost>}
      # Support requests (S59) to the team's address, in Mailpit locally.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@pepper.localhost}
      # Texts (S61, ADR-0065): the sandbox keeps them in the worker and sends nothing, as in
      # .env.example; the api and worker must agree (S62).
      SMS_PROVIDER: ${SMS_PROVIDER:-sandbox}
      # Payments (S65, ADR-0067): the sandbox, as in .env.example; Stripe needs its keys.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-sandbox}
      GOOGLE_CALENDAR_PROVIDER: ${GOOGLE_CALENDAR_PROVIDER:-sandbox}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_LIVE: ${STRIPE_LIVE:-off}
      # Web Push (ADR-0026): the api only needs the public key. Local-only default key pair (the
      # worker has the private half); generate your own for anything real.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BOaUPqJhSDXmacBl4Z6i_HCIBlCN8COqIGiY2jpVS8WxSO0bs5v6zR4YigbzbnlF45tJsCNBHQaAle1oMU1q2Ic}
      # The AI (ADR-0027): off without a key. `AI_SCRIPTED_PROVIDER=e2e` gives chat the
      # Playwright journeys' scripted model instead (CI sets it with DEPLOYMENT_ENVIRONMENT=ci;
      # the image is a production build, so it is refused otherwise, and next to a key; ADR-0031).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_ROUTINE: ${OPENAI_MODEL_ROUTINE:-}
      OPENAI_MODEL_STRONG: ${OPENAI_MODEL_STRONG:-}
      OPENAI_REASONING_ROUTINE: ${OPENAI_REASONING_ROUTINE:-}
      OPENAI_REASONING_STRONG: ${OPENAI_REASONING_STRONG:-}
      OPENAI_MODEL_EMBEDDING: ${OPENAI_MODEL_EMBEDDING:-}
      AI_SCRIPTED_PROVIDER: ${AI_SCRIPTED_PROVIDER:-}
      # Business photos (ADR-0048) in SeaweedFS; all S3_* set or none (photos off).
      # The Compose network name, not .env's localhost endpoint (which is for `pnpm dev`).
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-pepper-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pepperdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pepper-dev-only-s3-secret}
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    image: pepper-worker:dev
    environment:
      <<: *app-env
      PORT: '4100'
      # Queued emails (the outbox, ADR-0024) go to Mailpit's inbox too.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Pepper <bookings@pepper.localhost>}
      # Signs and sends pushes (ADR-0026). Local-only default key pair; never for real use.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BOaUPqJhSDXmacBl4Z6i_HCIBlCN8COqIGiY2jpVS8WxSO0bs5v6zR4YigbzbnlF45tJsCNBHQaAle1oMU1q2Ic}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-80nrfo5XabVQkQ6ud0KhaU-laJ8PtGLU7qw7oHlFyac}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:bookings@pepper.localhost}
      # Texts (S61, ADR-0065): the sandbox keeps them in the worker and sends nothing, as in
      # .env.example; the api and worker must agree (S62).
      SMS_PROVIDER: ${SMS_PROVIDER:-sandbox}
      # Deposits' captures, refunds and sweep (S66, ADR-0068): the api's provider.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-sandbox}
      GOOGLE_CALENDAR_PROVIDER: ${GOOGLE_CALENDAR_PROVIDER:-sandbox}
      # How often the calendar job looks for calendars to read and bookings to write (S70, S71);
      # 60 s by default, faster for the journeys.
      CALENDAR_POLL_MS: ${CALENDAR_POLL_MS:-}
      # Episodes (S31, ADR-0037): summaries of quiet conversations, with the routine model and
      # the embedding model. Off unless the key and OPENAI_MODEL_EMBEDDING are set (as for the api).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_ROUTINE: ${OPENAI_MODEL_ROUTINE:-}
      OPENAI_MODEL_STRONG: ${OPENAI_MODEL_STRONG:-}
      OPENAI_REASONING_ROUTINE: ${OPENAI_REASONING_ROUTINE:-}
      OPENAI_MODEL_EMBEDDING: ${OPENAI_MODEL_EMBEDDING:-}
      AI_MONTHLY_TOKENS: ${AI_MONTHLY_TOKENS:-}
      # How often the insights job looks for businesses whose feed is due (ADR-0039); 60 s
      # unless set. CI's journeys use 10 s so a new business's suggestions appear quickly.
      INSIGHTS_POLL_MS: ${INSIGHTS_POLL_MS:-}
      # The morning drafts pass (S36, ADR-0040): rebooking emails for owners to approve, with
      # the routine model; off unless OPENAI_API_KEY is set. Links in them use the web origin.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      DRAFTS_POLL_MS: ${DRAFTS_POLL_MS:-}
      # The support job (S59.2.2): a request waiting 4 h reminds the team's address (Mailpit
      # locally); one the team answered closes after 7 quiet days.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@pepper.localhost}
      SUPPORT_POLL_MS: ${SUPPORT_POLL_MS:-}
      # Deleting a business after its 30 days (S51.2, ADR-0054) deletes its photos' images
      # first: the same store as the api's.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-pepper-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pepperdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pepper-dev-only-s3-secret}
    ports: ['127.0.0.1:4100:4100']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    image: pepper-web:dev
    environment:
      API_INTERNAL_URL: http://api:4000
      # The origin the api checks, for the calls the web server makes itself (Google's return).
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      # The component gallery at /dev/gallery (S40): CI's screenshot run sets 1; off otherwise.
      PEPPER_GALLERY: ${PEPPER_GALLERY:-0}
      # Idle connections stay open longer than clients and proxies reuse them (Node's default
      # 5 s races a reused socket: ECONNRESET, seen in S26's Playwright runs).
      KEEP_ALIVE_TIMEOUT: '65000'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
