<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · Pepper</title>
    <!-- Served by the service worker when there is no connection (ADR-0023), so it carries its
         own styles: the design tokens of packages/ui/src/tokens.ts (a test keeps them in step). -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7faf5;
        --surface: #ffffff;
        --line: #dce6d8;
        --ink: #1b2a1e;
        --ink-2: #536257;
        --brand: #2a7230;
        --brand-strong: #23652a;
        --on-brand: #ffffff;
        --accent: #c2361b;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1510;
          --surface: #172019;
          --line: #2f3b31;
          --ink: #eaf3ea;
          --ink-2: #a7b7aa;
          --brand: #86d28e;
          --brand-strong: #97db9e;
          --on-brand: #0a1f0d;
          --accent: #ff8c70;
          --on-accent: #2a0b04;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 'Figtree Variable',
          system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 8px;
        font:
          700 24px/1.2 'Bricolage Grotesque Variable',
          system-ui,
          sans-serif;
      }
      p {
        margin: 0 0 24px;
        color: var(--ink-2);
      }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--brand-strong);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path
          fill="var(--accent)"
          d="M20 5c9.9 0 17 6.2 17 14.4S29.9 33.8 20 33.8c-1.9 0-3.7-.2-5.4-.7L7 37.4l1.3-7.2C5 27.6 3 23.7 3 19.4 3 11.2 10.1 5 20 5Z"
        />
        <path
          fill="none"
          stroke="var(--brand-strong)"
          stroke-width="3"
          stroke-linecap="round"
          d="M20 7.2c0-2.6 1.4-4.6 4.4-5.6"
        />
        <circle fill="var(--on-accent)" cx="14.2" cy="17.4" r="2.3" />
        <circle fill="var(--on-accent)" cx="25.8" cy="17.4" r="2.3" />
        <path
          fill="none"
          stroke="var(--on-accent)"
          stroke-width="2.4"
          stroke-linecap="round"
          d="M14.4 23.6c3.2 3 8 3 11.2 0"
        />
      </svg>
      <h1>You’re offline</h1>
      <p>
        Pepper needs a connection to show your calendar and bookings. This page opens again as soon
        as you’re back online.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => location.reload());
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
