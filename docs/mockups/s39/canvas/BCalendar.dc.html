<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Calendar day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Geist', system-ui, sans-serif; font-size: 16px; line-height: 1.4; letter-spacing: -0.005em">
<header style="padding: 28px 24px 14px; display: flex; flex-direction: column; gap: 16px; border-bottom: 1px solid {{t.line}}">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 500; color: {{t.ink2}}; text-transform: uppercase; letter-spacing: 0.08em">Tuesday</span>
<h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.035em; line-height: 1">October 27</h1>
</div>
<div style="display: flex; gap: 4px">
<button type="button" aria-label="Previous day" style="width: 44px; height: 44px; border: 1px solid {{t.lineStrong}}; border-radius: 10px; background: transparent; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
<button type="button" aria-label="Next day" style="width: 44px; height: 44px; border: 1px solid {{t.lineStrong}}; border-radius: 10px; background: transparent; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
</div>
<div role="group" aria-label="Whose day" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 11px; background: {{t.surface2}}">
<sc-for list="{{tabs}}" as="x" hint-placeholder-count="3">
<button type="button" onClick="{{x.pick}}" aria-pressed="{{x.on}}" style="{{x.style}}">{{x.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 20px; font-size: 14px; color: {{t.ink2}}; font-variant-numeric: tabular-nums">
<span><strong style="color: {{t.ink}}">{{count}}</strong> visits</span>
<span><strong style="color: {{t.accent}}">{{money}}</strong> booked</span>
<span><strong style="color: {{t.ink}}">{{gaps}}</strong> open</span>
</div>
</header>

<main style="flex: 1; overflow-y: auto; padding: 0 24px 24px">
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<li style="display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid {{t.line}}">
<span style="font-size: 14px; font-weight: 500; color: {{t.ink2}}; font-variant-numeric: tabular-nums">{{r.at}}</span>
<sc-if value="{{r.isOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; padding: 10px 12px; border: 1px dashed {{t.lineStrong}}; border-radius: 10px">
<span style="font-weight: 600">{{r.name}}</span>
<span style="font-size: 14px; color: {{t.ink2}}">{{r.sub}}</span>
</div>
</sc-if>
<sc-if value="{{r.isAppt}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column">
<span style="font-weight: 600">{{r.name}}</span>
<span style="font-size: 14px; color: {{t.ink2}}">{{r.sub}}</span>
</div>
</sc-if>
<sc-if value="{{r.isOpen}}" hint-placeholder-val="{{ false }}">
<a href="BHome.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; background: {{t.brand}}; color: {{t.brandInk}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Fill</a>
</sc-if>
<sc-if value="{{r.isAppt}}" hint-placeholder-val="{{ true }}">
<span style="width: 28px; height: 28px; border-radius: 50%; border: 1px solid {{t.lineStrong}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center" aria-label="{{r.whoLong}}">{{r.who}}</span>
</sc-if>
</li>
</sc-for>
</ol>
</main>

<nav aria-label="Main" style="display: flex; justify-content: space-around; padding: 6px 8px 22px; background: {{t.bar}}; border-top: 1px solid {{t.line}}">
<a href="BHome.dc.html" style="min-width: 60px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink3}}; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="BCalendar.dc.html" aria-current="page" style="min-width: 60px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink}}; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
<a href="BClient.dc.html" style="min-width: 60px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink3}}; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Clients</a>
<a href="BApprove.dc.html" style="min-width: 60px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink3}}; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat</a>
<a href="BBooking.dc.html" style="min-width: 60px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink3}}; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'All' };
  }
  renderVals() {
    const light = { bg: '#FFFFFF', bar: '#FAFAFA', surface: '#FFFFFF', surface2: '#F3F3F2', ink: '#0E0E10', ink2: '#4A4A50', ink3: '#6B6B72', line: '#E6E6E8', lineStrong: '#8A8A92', brand: '#0E0E10', brandInk: '#FFFFFF', accent: '#1E7B54' };
    const dark = { bg: '#0A0A0B', bar: '#141416', surface: '#2A2A2E', surface2: '#1C1C1F', ink: '#F4F4F5', ink2: '#B4B4BA', ink3: '#8E8E96', line: '#26262A', lineStrong: '#6E6E76', brand: '#F4F4F5', brandInk: '#0A0A0B', accent: '#4FD39A' };
    const t = this.props.dark ? dark : light;
    const all = [
      ['9:00', 'D', 'Kevin Nguyen', 'Haircut · 30 min · $35', 35],
      ['9:45', 'D', 'Andre Wallace', 'Skin fade · 45 min · $45 · new', 45],
      ['10:00', 'R', 'Brandon Lee', 'Skin fade · 45 min · $45', 45],
      ['10:30', 'D', "Mike O'Connor", 'Haircut and beard · $55', 55],
      ['11:00', 'R', 'Omar Haddad', 'Beard trim · 15 min · $20', 20],
      ['11:30', 'D', 'Jordan Ellis', 'Hot towel shave · $45', 45],
      ['1:00', 'D', 'Open until 2:30', '90 min · Jaylen is waiting · +$45', 0, true],
      ['1:00', 'R', 'Victor Diaz', 'Haircut · 30 min · $35', 35],
      ['2:30', 'D', 'Darius Hill', 'Haircut · asked to move', 35],
      ['3:00', 'R', 'Ray Thompson', 'Haircut and beard · $55', 55],
      ['3:15', 'D', 'Nate Simmons', 'Line-up · 15 min · $15', 15],
      ['3:30', 'D', 'Open until 5:00', '90 min · fits 2 haircuts · ~$70', 0, true],
      ['4:30', 'R', 'Jamal Price', 'Buzz cut · 15 min · $20', 20],
      ['5:00', 'D', 'Eli Romero', "Kid's cut · 30 min · $25", 25],
    ].map(([at, who, name, sub, price, open]) => ({ at, who, whoLong: who === 'D' ? 'With Dre' : 'With Randy', name, sub, price, isOpen: !!open, isAppt: !open }));
    const pickWho = this.state.who;
    const rows = all.filter((r) => pickWho === 'All' || (pickWho === 'Dre' ? r.who === 'D' : r.who === 'R'));
    const tab = 'min-height: 40px; border: 0; border-radius: 9px; font: inherit; font-size: 14px; cursor: pointer; ';
    const tabs = ['All', 'Dre', 'Randy'].map((label) => {
      const on = pickWho === label;
      return { label, on, pick: () => this.setState({ who: label }), style: tab + (on ? 'background: ' + t.surface + '; color: ' + t.ink + '; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12);' : 'background: transparent; color: ' + t.ink2 + '; font-weight: 500;') };
    });
    const appts = rows.filter((r) => r.isAppt);
    const money = '$' + appts.reduce((s, r) => s + r.price, 0);
    return { t, rows, tabs, count: appts.length, money, gaps: rows.length - appts.length };
  }
}
</script>
</body>
</html>
