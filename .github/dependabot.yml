# Monthly, with each ecosystem's updates grouped into one pull request, so CI runs a few times a
# month rather than once per package (GitHub Actions minutes are limited; dev-setup.md).
# Security updates still arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Minor and patch updates of every package together; a major update gets its own PR.
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 (docs/engineering/dev-setup.md).
      - dependency-name: typescript
        versions: ['>= 6.1.0']
      # Types track the Node major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
    ignore:
      # The node base image tracks the Node LTS major in .nvmrc; major upgrades are planned changes.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-compose:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
