name: CI

# Minutes are limited (private repo), so CI runs once per change (docs/engineering/dev-setup.md):
# - on pull requests. Branch protection requires the branch to be up to date with main, so the
#   PR run has tested exactly what a merge lands; main is not tested again on push.
# - weekly on main, and by hand (workflow_dispatch), as a safety net.
# A pull request that changes only docs (docs/** or *.md) skips the jobs below; so does a push
# that changes only docs since a head whose checks all passed (a session pushes its close notes
# after the code's run is green); skipped jobs count as passed for the required checks.
# On pull requests the integration jobs run only the packages a change can affect (Turborepo
# `--affected`: changed packages and their dependents); a change outside every package (CI,
# root configuration, the lockfile's root) runs them all, as do the weekly and manual runs.
on:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Code changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      all: ${{ steps.diff.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The PR's merge commit and its first parent, the base branch.
          fetch-depth: 2

      - name: Compare with the base branch and the last tested head
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'all=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only() { [ -n "$1" ] && ! printf '%s\n' "$1" | grep -qvE '^docs/|\.md$'; }
          files="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$files"
          # Anything outside a workspace package (CI, root configuration) runs every package.
          if printf '%s\n' "$files" | grep -qvE '^(apps|packages|e2e)/|^docs/|\.md$'; then
            echo 'all=true' >> "$GITHUB_OUTPUT"
          else
            echo 'all=false' >> "$GITHUB_OUTPUT"
          fi
          if docs_only "$files"; then
            echo 'Only docs changed: the checks below are skipped.'
            echo 'code=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push of docs only on top of a head whose checks all passed (or were skipped as
          # docs) needs no new run. Any doubt (a failed lookup, a check missing, failed or
          # cancelled) runs everything.
          if [ "$ACTION" = 'synchronize' ] && [ -n "$BEFORE" ]; then
            since="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD_SHA" \
              --jq '.files[].filename' 2>/dev/null || true)"
            if docs_only "$since"; then
              verdict="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs?per_page=100" \
                --jq '[.check_runs[]
                  | select(.name | test("^(Lint, typecheck, test, build|Integration \\(.*\\)|E2E smoke \\(Docker Compose\\))$"))]
                  | group_by(.name) | map(max_by(.started_at))
                  | if length == 4 and all(.conclusion == "success" or .conclusion == "skipped")
                    then "passed" else "no" end' 2>/dev/null || echo no)"
              if [ "$verdict" = 'passed' ]; then
                echo "Only docs changed since $BEFORE, whose checks passed: skipped."
                echo 'code=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo 'code=true' >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test, build
    needs: changes
    # Fail-safe: anything but an explicit "docs only" (including a failed comparison) runs.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  integration:
    name: Integration (Testcontainers)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch's history, for `--affected`.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Real Postgres (pgvector) and Redis in throwaway containers, same images as Compose.
      # Every package but the AI evals, which run beside this job (2 CPUs each).
      - name: Integration tests
        env:
          AFFECTED: ${{ needs.changes.outputs.all != 'true' && '--affected' || '' }}
        run: pnpm turbo run test:integration $AFFECTED --filter='!@pepper/ai'

  ai-integration:
    name: Integration (AI evals)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The AI package's tools, agent loop and eval replays (about 10 minutes on its own runner,
      # so they no longer slow the other packages' timed tests).
      - name: Integration tests
        env:
          AFFECTED: ${{ needs.changes.outputs.all != 'true' && '--affected' || '' }}
        run: pnpm turbo run test:integration $AFFECTED --filter=@pepper/ai

  # The browser journeys take ~19 minutes on one 2-CPU runner (one worker: the stack shares the
  # CPUs), so they run on three runners at once, each with its own stack. Each shard takes a third
  # of the phone project and a third of the desktop project (split apart, as the desktop specs
  # come last and are the long ones; screens.spec.ts splits by test in CI).
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/3
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # ~5 min to build the stack, ~6–7 min of journeys.
    timeout-minutes: 25
    strategy:
      # Every shard runs to the end, so one red run shows every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @pepper/e2e exec playwright install --with-deps chromium

      # Chat runs on the journeys' scripted model (ADR-0031): CI never calls OpenAI.
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
        env:
          AI_SCRIPTED_PROVIDER: e2e
          DEPLOYMENT_ENVIRONMENT: ci
          INSIGHTS_POLL_MS: '10000'
          DRAFTS_POLL_MS: '10000'
          CALENDAR_POLL_MS: '10000'
          # The component gallery, for its screenshot tests (S40, e2e/tests/gallery.spec.ts).
          PEPPER_GALLERY: '1'

      - name: Build the test helpers' packages
        run: pnpm turbo run build --filter=@pepper/e2e^... --output-logs=errors-only

      # Both projects run even when the first fails; the step fails if either did.
      - name: Journeys (this shard)
        env:
          SHARD: ${{ matrix.shard }}/3
        run: |
          status=0
          for project in mobile desktop; do
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$project" \
              pnpm --filter @pepper/e2e exec playwright test \
              --project="$project" --shard="$SHARD" --output="test-results/$project" || status=1
          done
          exit "$status"

      - name: Stack logs
        if: failure() || cancelled()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The one check branch protection requires (and the docs-only skip reads): green only when
  # every shard is, skipped (counted as passed) when the shards were skipped for docs.
  e2e:
    name: E2E smoke (Docker Compose)
    needs: [changes, e2e-shard]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "Shards: $SHARDS"
          [ "$SHARDS" = 'success' ]
