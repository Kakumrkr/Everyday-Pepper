name: CI

# Minutes are limited (private repo), so CI runs once per change (docs/engineering/dev-setup.md):
# - on pull requests. Branch protection requires the branch to be up to date with main, so the
#   PR run has tested exactly what a merge lands; main is not tested again on push.
# - weekly on main, and by hand (workflow_dispatch), as a safety net.
# A pull request that changes only docs (docs/** or *.md) skips the three jobs below; skipped
# jobs count as passed for the required checks.
on:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Code changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The PR's merge commit and its first parent, the base branch.
          fetch-depth: 2

      - name: Compare with the base branch
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo 'Only docs changed: the checks below are skipped.'
            echo 'code=false' >> "$GITHUB_OUTPUT"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, typecheck, test, build
    needs: changes
    # Fail-safe: anything but an explicit "docs only" (including a failed comparison) runs.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  integration:
    name: Integration (Testcontainers)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Real Postgres (pgvector) and Redis in throwaway containers, same images as Compose.
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: E2E smoke (Docker Compose)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @pepper/e2e exec playwright install --with-deps chromium

      # Chat runs on the journeys' scripted model (ADR-0031): CI never calls OpenAI.
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
        env:
          AI_SCRIPTED_PROVIDER: e2e
          DEPLOYMENT_ENVIRONMENT: ci
          INSIGHTS_POLL_MS: '10000'

      - name: Smoke test
        run: pnpm test:e2e

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
